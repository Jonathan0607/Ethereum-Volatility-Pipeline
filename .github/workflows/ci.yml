name: CI

on:
  push:
    branches:
      - main
      - "feat/*"
  pull_request:
    branches:
      - main
      - "feat/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Unit Tests (Fresh Clone)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apex_multimodal_risk/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apex_multimodal_risk/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check apex_multimodal_risk/

      - name: Run Pytest (Zero Local Artifacts)
        env:
          PYTHONPATH: .
        run: |
          pytest apex_multimodal_risk/tests/ -m "not requires_local_artifacts" -v
