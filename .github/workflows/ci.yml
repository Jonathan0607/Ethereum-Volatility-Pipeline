name: CI

on:
  push:
    branches:
      - main
      - "feat/*"
  pull_request:
    branches:
      - main
      - "feat/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Lean Unit Tests (Fresh Clone)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apex_multimodal_risk/requirements-serving.txt"

      - name: Install Lean CI Dependencies (< 45s, Zero PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r apex_multimodal_risk/requirements-serving.txt
          pip install pytest ruff scikit-learn

      - name: Run Ruff Linter
        run: |
          ruff check --config apex_multimodal_risk/pyproject.toml apex_multimodal_risk/

      - name: Run Pytest (Zero Local Artifacts)
        env:
          PYTHONPATH: .
          APEX_ALLOW_MOCK_MODELS: "1"
        run: |
          pytest -c apex_multimodal_risk/pyproject.toml apex_multimodal_risk/tests/ -m "not requires_local_artifacts" -v
